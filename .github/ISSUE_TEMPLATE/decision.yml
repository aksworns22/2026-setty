name: 결정 필요
description: 구현 전에 팀 합의가 필요한 제품·운영·기술 결정을 등록합니다.
title: "[Decision] 결정할 문제"
labels:
  - "type:decision"
  - "needs:decision"
body:
  - type: textarea
    id: problem
    attributes:
      label: 결정할 문제
      description: 무엇이 막혀 있으며 왜 지금 결정해야 하는지 작성합니다.
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: 확인된 사실
      description: 추측과 분리해 출처가 있는 사실만 작성합니다.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 선택지와 장단점
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 위험과 되돌리기 비용
      description: 개인정보·법률·비용·사용자 피해 여부를 포함합니다.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 회의 결과
      description: 합의 전에는 비워두고 회의 후 DEC 문서 링크와 결론을 적습니다.
    validations:
      required: false
