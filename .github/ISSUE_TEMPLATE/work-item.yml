name: 개발 작업 Issue
description: 승인된 요구사항을 구현·검증 가능한 작업으로 등록합니다.
title: "[영역] 사용자 또는 운영자 결과"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        관련 최신 문서와 결정 기록을 먼저 확인하세요. 제품 정책이 미정이면 구현하지 말고 결정 Issue를 생성합니다.
  - type: input
    id: decision
    attributes:
      label: 관련 요구사항·결정
      description: 문서 경로, DEC 번호 또는 관련 Issue를 작성합니다.
      placeholder: "DEC-016, docs/product/user-operation-flow.md"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: 부모 결과 Issue
      description: 여러 하위 작업이 함께 만드는 부모 결과 Issue 번호를 적습니다. 부모 카드 자체라면 비워둡니다.
      placeholder: "관련 상위 Issue #123 또는 없음"
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: 만들어야 하는 결과
      description: 기술 작업이 아니라 사용자 또는 운영자에게 생기는 결과로 작성합니다.
      placeholder: "구매자가 견적 요청을 제출하면 운영자 목록에 검토 대기 요청이 표시된다."
    validations:
      required: true
  - type: textarea
    id: included
    attributes:
      label: 포함 범위
    validations:
      required: true
  - type: textarea
    id: excluded
    attributes:
      label: 제외 범위
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 확인 가능한 항목으로 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: 검증 시나리오
      description: 정상·거절·오류·권한 시나리오를 포함합니다.
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: 필요한 선행 결정
      description: 구현 전에 합의·검증돼야 하는 DEC와 아직 남은 차단 조건을 적습니다.
      placeholder: "DEC-016, DEC-022, DEC-023"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 의존 작업
      description: 먼저 완료되거나 계약이 확정돼야 하는 다른 Issue를 적습니다. 없으면 없음으로 작성합니다.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 담당자
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: 리뷰어
    validations:
      required: true
  - type: checkboxes
    id: before_start
    attributes:
      label: 시작 전 확인
      description: 충족한 항목만 체크합니다. 시작할 수 없다면 status:blocked와 이유를 표시합니다.
      options:
        - label: 이 카드 범위에서 기술 담당자가 추측해야 할 미결정 사항이 없다.
          required: false
        - label: 개발 차단과 실제 사용자 공개 차단을 구분했다.
          required: false
        - label: 한 사람의 진행 중 작업 제한을 확인했다.
          required: false
        - label: 부모 결과, 선행 결정과 의존 작업을 확인했다.
          required: false
        - label: 시작 가능 또는 막힘을 표시하고, 막혔다면 이유를 적었다.
          required: true
